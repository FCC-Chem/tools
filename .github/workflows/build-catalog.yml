name: Build and deploy catalog

# Builds index.html and publishes the site as a Pages artifact.
#
# The catalog is NOT committed back to the repository. An earlier version
# of this workflow did that, which meant every contributor's next push
# conflicted on a machine-generated file. Publishing an artifact removes
# the bot commit entirely, so nobody ever has to resolve that conflict.
#
# Requires: Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 12 * * *'   # daily, about 4-5 AM Pacific, to refresh "Opened N times"

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Optional: click counts from GoatCounter. Does nothing until the
      # GOATCOUNTER_CODE variable and GOATCOUNTER_TOKEN secret are added
      # (Settings -> Secrets and variables -> Actions). Never fails the build.
      - name: Fetch usage counts
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          USAGE_FILE: ${{ runner.temp }}/usage.json
        run: python3 .github/scripts/fetch_usage.py || true

      - name: Build catalog
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          USAGE_FILE: ${{ runner.temp }}/usage.json
        run: python3 scripts/build_catalog.py

      - name: Fail if the catalog is empty or malformed
        run: |
          test -s index.html || { echo "::error::index.html was not generated"; exit 1; }
          grep -q "</html>" index.html || { echo "::error::index.html is truncated"; exit 1; }
          echo "index.html: $(wc -c < index.html) bytes"

      - uses: actions/configure-pages@v5

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
