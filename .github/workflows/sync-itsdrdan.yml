name: Sync Dr. Dan's games from his personal repos

# Dr. Dan develops each game in his own repo (github.com/ItsDrDan/<repo>).
# This workflow gathers all of them into ONE catalog entry,
# itsdrdan/study-games/, with a launcher page that sorts the games by course.
# The game list comes from his study hub (ItsDrDan/games, data/hub.js), so a
# new game appears here as soon as it is on the hub. See
# .github/scripts/sync_itsdrdan.py for details.
#
# Runs every hour, and can be run on demand from the Actions tab
# ("Sync Dr. Dan's games..." -> Run workflow).
#
# Only the itsdrdan/ folder is ever touched. Edits made to itsdrdan/
# directly in this repo WILL be overwritten -- change the personal repo.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # commit the copied files
  actions: write    # start the catalog rebuild afterwards

concurrency:
  group: sync-itsdrdan
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy Dr. Dan's games into itsdrdan/study-games
        id: sync
        run: |
          python3 .github/scripts/sync_itsdrdan.py

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A itsdrdan
          if git diff --cached --quiet; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --stat | tail -5
            git commit -q -m "Sync Dr. Dan's games from his personal repos"
            # A colleague may have pushed while this ran; put this commit on top of theirs.
            git pull -q --rebase origin main
            git push -q
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made by this workflow does not start other workflows on its
      # own, so start the catalog build explicitly.
      - name: Rebuild the catalog site
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-catalog.yml --repo "${{ github.repository }}" --ref main
